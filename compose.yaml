services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: findme
      POSTGRES_USER: findme
      POSTGRES_PASSWORD: findme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  temporal:
    image: temporalio/server:latest
    ports:
      - "7233:7233"
      - "8233:8233"
    environment:
      - DB=sqlite
      - SQLITE_PRAGMAS=journal_mode=WAL;synchronous=NORMAL
      - SERVICES=default,frontend,history,matching,worker,web

