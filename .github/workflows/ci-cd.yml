name: CI

# --- Declencheurs -----------------------------------------------------------
# On declenche sur push/PR vers main et develop : c'est l'evenement GitHub qui
# lance l'automatisation (cf. support Chapitre 1 - "un pipeline CI/CD ne peut
# exister sans depot distant").
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Principe du moindre privilege (cf. Chapitre 2, "erreurs frequentes") :
# par defaut le workflow ne peut que LIRE le depot. Chaque job qui a besoin de
# plus (ecrire dans l'onglet Security, etc.) le redeclare lui-meme.
permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  # ===========================================================================
  # JOB 1 - SECRET SCANNING (Gitleaks)
  # ===========================================================================
  # Role de l'outil : Gitleaks parcourt l'historique Git a la recherche de
  # cles API, tokens, mots de passe commites par erreur.
  # Pourquoi en premier et bloquant : une fuite de secret est un risque
  # immediat et irreversible (cf. Chapitre 3, tableau "Synthese par controle").
  # Un secret pousse doit etre detecte avant que le reste de la pipeline (qui
  # pourrait aussi le journaliser dans des logs) ne s'execute.
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet necessaire a Gitleaks

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # JOB 2 - BUILD, TESTS ET QUALITY GATE
  # ===========================================================================
  # Role des outils :
  #  - actions/setup-java (cache: maven) : evite de retelecharger ~/.m2 a
  #    chaque run, ce qui reduit fortement le temps de pipeline.
  #  - Surefire (via "mvn test") : execute les tests rapides en premier
  #    (principe du "fail fast", cf. Chapitre 2).
  #  - Checkstyle / PMD : analyse de style et de qualite de code, configures
  #    en NON BLOQUANT (failOnViolation=false) dans le pom.xml actuel : ils
  #    remontent des avertissements sans casser le build.
  #  - JaCoCo : mesure la couverture de tests puis applique un seuil minimal
  #    (Quality Gate) qui, lui, EST bloquant si non atteint.
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build (compile)
        run: ./mvnw -B compile

      # --- Etape "fail fast" -------------------------------------------------
      # Tests unitaires + tests de composants (packages unit/, integration/,
      # controller/, service/, mapper/, entity/, security/... du projet) :
      # rapides, sans dependance externe (H2 en memoire), executes en premier
      # pour donner un retour rapide au developpeur.
      - name: Unit & component tests
        run: ./mvnw -B test -Dtest='!**/e2e/**'

      # --- Etape "flux complets" ----------------------------------------------
      # Tests End-to-End (package e2e/) : ils demarrent le contexte Spring
      # complet et rejouent un scenario utilisateur de bout en bout
      # (ex. inscription -> connexion -> mise a jour du profil). Plus longs,
      # ils s'executent apres la validation des tests unitaires.
      - name: End-to-end tests
        run: ./mvnw -B test -Dtest='**/e2e/**'

      # --- Analyse statique (non bloquante) + Quality Gate de couverture -----
      # "verify" declenche dans l'ordre : Checkstyle (phase validate, warning
      # uniquement), PMD (phase verify, warning uniquement), puis JaCoCo qui
      # agrege la couverture des deux etapes de tests precedentes (le fichier
      # jacoco.exec n'est pas reinitialise entre les steps) et applique le
      # seuil minimal configure dans le pom.xml.
      - name: Static analysis & coverage Quality Gate
        run: ./mvnw -B verify -DskipTests

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload test results (Surefire)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

  # ===========================================================================
  # JOB 3 - CONTAINER SECURITY (build de l'image + scan Trivy)
  # ===========================================================================
  # Role de l'outil : Trivy analyse l'image Docker construite (packages
  # systeme de l'image de base + dependances applicatives) a la recherche de
  # vulnerabilites connues (CVE). L'image n'est PAS publiee ici (pas de push
  # vers un registry) : ce job reste dans le perimetre "securite du
  # conteneur" du Chapitre 3. La publication + le deploiement (Chapitre 4)
  # pourront être ajoutés dans un second temps.
  container-scan:
    name: Container Security (Trivy)
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      security-events: write # necessaire pour publier le rapport dans l'onglet Security
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (local, non publiee)
        run: docker build -t findme-backend:${{ github.sha }} .

          # --- Etape lisible (non bloquante) -------------------------------------
          # Meme scan, mais affiche directement le detail (CVE, package, version
          # corrigee) dans les logs Actions. Utile pour diagnostiquer sans avoir
          # a ouvrir l'onglet Security (qui necessite parfois des droits
          # supplementaires sur un depot prive).
      - name: Trivy scan (table, informational)
        uses: aquasecurity/trivy-action@v0.37.0
        with:
           image-ref: findme-backend:${{ github.sha }}
           format: table
           severity: HIGH,CRITICAL
           exit-code: '0'
           trivy-config: trivy.yaml

          # --- Etape bloquante (Quality Gate) -------------------------------------
          # Meme resultat, au format SARIF, publie dans l'onglet Security. C'est
          # cette etape qui fait echouer le job si une CVE HIGH/CRITICAL subsiste.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.37.0
        with:
            image-ref: findme-backend:${{ github.sha }}
            format: sarif
            output: trivy-results.sarif
            severity: HIGH,CRITICAL
            exit-code: '1' # bloque le job si une vulnerabilite haute/critique est trouvee
            trivy-config: trivy.yaml

      - name: Upload Trivy results to Security tab
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif